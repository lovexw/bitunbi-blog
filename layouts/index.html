{{ define "content" }}
<div class="home">
    <section class="hero">
        <h1>小吴乐意</h1>
        <p class="hero__subtitle">比特币世界观 · 生活随笔 · 数据驱动的长期主义</p>
        <p class="hero__desc">时间是比特币的朋友，市场奖励的是时间，不是精准。</p>
    </section>

    <section class="recent-posts">
        <h2>最新文章</h2>
        <div class="post-list">
            {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
            <article class="post-card">
                <h3 class="post-card__title">
                    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                </h3>
                <div class="post-card__meta">
                    <time>{{ .Date.Format "2006-01-02" }}</time>
                </div>
                <div class="post-card__summary">
                    {{ .Summary | plainify | truncate 100 }}
                </div>
                <a href="{{ .RelPermalink }}" class="post-card__readmore">阅读全文 →</a>
            </article>
            {{ end }}
        </div>
        <a href="/posts/" class="view-all">查看全部文章 →</a>
    </section>
</div>
{{ end }}
